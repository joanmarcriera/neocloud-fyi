name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm ci && npm test
        working-directory: tools/updater

  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Audit home, provider and path pages
        id: lighthouse
        run: npx --no-install lhci autorun --failOnUploadFailure
        working-directory: site
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: site/.cache/lighthouse/
          include-hidden-files: true
          if-no-files-found: error
